<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4a9b72">
  <title>Kenney Solé's Race</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
  <script>
    // Cache busting: every release bumps VERSION (node tools/release.mjs) so
    // browsers never mix old and new modules. Builds the import map with
    // versioned URLs for all game modules, then loads the styles and main.js.
    (function () {
      var VERSION = '7';
      var MODULES = ['camera.js', 'car.js', 'carModel.js', 'config.js', 'decor.js', 'effects.js', 'endScreen.js', 'hud.js', 'input.js', 'intro.js', 'main.js', 'menu.js', 'race.js', 'ranking.js', 'rankingList.js', 'themes.js', 'track.js', 'trackPath.js', 'tracks.js'];
      var imports = {
        three: './lib/three/three.module.min.js',
        'three/addons/': './lib/three/addons/',
      };
      MODULES.forEach(function (m) {
        imports['./src/' + m] = './src/' + m + '?v=' + VERSION;
      });
      var map = document.createElement('script');
      map.type = 'importmap';
      map.textContent = JSON.stringify({ imports: imports });
      document.head.appendChild(map);
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = './style.css?v=' + VERSION;
      document.head.appendChild(css);
      window.addEventListener('DOMContentLoaded', function () {
        var main = document.createElement('script');
        main.type = 'module';
        main.src = './src/main.js?v=' + VERSION;
        document.body.appendChild(main);
      });
    })();
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud" hidden></div>
  <div id="intro" hidden></div>
  <button id="back" type="button" aria-label="Menú" hidden>✕</button>
  <div id="menu" hidden></div>
  <div id="end" hidden></div>
</body>
</html>
